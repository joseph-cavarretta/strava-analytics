# docker compose build <service_name> to rebuild specific service
# to connect to strava db in superset: use host=host.docker.internal, port=5433
services:
  db:
    build: ./database/
    ports:
      - 5433:5432
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    volumes:
      # Only the data persists; mounting all of /app kept serving the first build's code.
      - data:/app/data
    depends_on:
      - db

volumes:
  data: