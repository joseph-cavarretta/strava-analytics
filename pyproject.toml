[project]
name = "strava-analytics"
version = "0.1.0"
description = "ETL pipeline for Strava activity data with Postgres and Superset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.3,<4",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10",
    "ruff>=0.16",
    "pandas-stubs>=3.0.5.260914",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff]
extend = "../agent-dev-harness/python-styleguide/ruff-base.toml"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
# Same loose paths as the lint baseline: scripts/ and .local/ are not checked.
exclude = ['(^|/)scripts/', '(^|/)\.local/']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These packages ship no type information.
module = ["psycopg2.*"]
ignore_missing_imports = true
